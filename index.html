<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.classList.add("js")</script>
</head>
<body>
<nav><div class="wrap">
  <a id="mark" href="index.html"></a>
  <ul><li><a href="index.html#work">Work</a></li><li><a href="index.html#about">About</a></li><li><a data-resume href="#">Résumé</a></li></ul>
</div></nav>
<header class="hero"><div class="wrap">
  <div class="stone">
    <div class="stone-top"><span>Engineering portfolio</span><span id="headline"></span><span id="loc"></span></div>
    <div class="hero-mid">
      <div class="headshot" id="headshot"></div>
      <h1 data-name></h1>
    </div>
    <div class="hero-bottom">
      <p id="intro"></p>
      <div class="btns"><a class="btn primary" href="#work">See projects</a><a class="btn" data-resume href="#">Download résumé</a></div>
    </div>
  </div>
</div></header>
<main>
  <section id="work"><div class="wrap"><div class="sec-head"><p class="eyebrow">Work</p><h2>Selected projects</h2></div><div id="projects"></div></div></section>
  <section id="about"><div class="wrap about">
    <div><p class="eyebrow">About</p><h2>A little about me</h2><div id="about-text"></div><div class="btns" id="links"></div></div>
    <div id="skills" aria-label="Skills"></div>
  </div></section>
  <section id="credentials"><div class="wrap">
    <div class="sec-head"><p class="eyebrow">Credentials</p><h2>Certifications &amp; experience</h2></div>
    <div class="credentials">
      <div><p class="sub">Certifications</p><div id="certifications" aria-label="Certifications"></div></div>
      <div><p class="sub">Experience</p><div id="experience" aria-label="Experience"></div></div>
    </div>
  </div></section>
</main>
<footer><div class="wrap"><span>© <span id="year"></span> <span data-name></span></span><a href="#">Back to top</a></div></footer>
<script src="content.js"></script>
<script src="app.js"></script>
<script src="motion.js"></script>
